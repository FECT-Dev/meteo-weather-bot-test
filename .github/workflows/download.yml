name: Daily Weather PDF Download & Summary

on:
  schedule:
    - cron: '30 9 * * *'
    - cron: '30 13 * * *'   # (earlier edit) retry run
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # (earlier edit)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set Git identity
        run: |
          git config --global user.name "Auto Commit Bot"
          git config --global user.email "actions@github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # (earlier edit) was '3.x'

      # TEMPORARY: remove this step once you know why the connection fails
      - name: Diagnose connection to meteo.gov.lk
        continue-on-error: true
        run: |
          echo "--- DNS ---"
          getent ahosts meteo.gov.lk || echo "DNS lookup failed"
          echo "--- Runner public IP ---"
          curl -s -m 15 https://api.ipify.org; echo
          echo "--- IPv4 ---"
          curl -4 -sS -m 20 -o /dev/null -w "dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s status=%{http_code}\n" https://meteo.gov.lk/ || echo "IPv4 failed"
          echo "--- IPv6 ---"
          curl -6 -sS -m 20 -o /dev/null -w "status=%{http_code}\n" https://meteo.gov.lk/ || echo "IPv6 failed"
          echo "--- Plain HTTP ---"
          curl -sS -m 20 -I http://meteo.gov.lk/ || echo "HTTP failed"

      # UPDATED: Added Chrome installation here
      - name: Install system dependencies (including Chrome)
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript python3-tk tesseract-ocr poppler-utils libtesseract-dev wget unzip
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt install -y ./google-chrome-stable_current_amd64.deb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pdfplumber camelot-py[cv] pdf2image pytesseract PyPDF2 selenium chromedriver-autoinstaller pillow

      - name: Run the PDF download script
        run: |   # (earlier edit) skip if today's PDF already exists
          TODAY=$(date +%Y-%m-%d)
          if [ -f "reports/$TODAY/weather-$TODAY.pdf" ]; then
            echo "Today's PDF already exists. Skipping download."
          else
            python download_weather_pdf.py
          fi

      - name: Move and rename the PDF to reports/YYYY-MM-DD
        run: |
          TODAY=$(date +%Y-%m-%d)
          mkdir -p reports/$TODAY
          if ls downloads/$TODAY/*.pdf 1> /dev/null 2>&1; then
            mv downloads/$TODAY/*.pdf reports/$TODAY/weather-$TODAY.pdf
            echo "Moved PDF to reports/$TODAY/"
          else
            echo "No PDF downloaded. Skipping move."
          fi

      - name: Run weather summary extraction
        run: python update_weather_summary.py

      - name: Commit & push updated weather report & summary
        run: |
          git fetch origin main || true
          git checkout -B main
          git pull --ff-only origin main || true

          git add reports/ weather_summary.csv || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add weather report and update summary for $(date +%Y-%m-%d)"
            git push origin HEAD:main
          fi
